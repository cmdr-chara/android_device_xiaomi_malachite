name: Target-files hard-brick safety contracts
on:
  push:
    branches: [revival/prebuild-safety-20260906]
  pull_request:
    branches: [lineage-23.2]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run target-files safety regression suite
        run: python3 -m unittest -v tests/test_target_files_safety.py
